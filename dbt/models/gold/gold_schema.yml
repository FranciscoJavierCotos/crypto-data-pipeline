version: 2

models:
  - name: gold_sentiment_vs_price
    description: >
      Sentiment and on-chain regime versus next-day price change.
      Answers: "Does extreme fear predict BTC price recovery?"
    columns:
      - name: id
        tests:
          - not_null
      - name: metric_date
        tests:
          - not_null
      - name: fear_greed_value
      - name: fear_greed_label
      - name: btc_tx_count
      - name: btc_unique_addresses
      - name: btc_hash_rate
      - name: btc_mempool_size
      - name: current_price
      - name: total_volume
      - name: volume_to_market_cap_ratio
      - name: next_day_price_change_pct
      - name: onchain_activity_regime

  - name: gold_volatility_signal
    description: >
      Rolling volatility analysis per crypto asset with 7d/30d metrics.
      Answers: "Is BTC more or less volatile than altcoins?" and "Which coins have extreme volatility?"
    columns:
      - name: id
        tests:
          - not_null
      - name: symbol
        tests:
          - not_null
      - name: name
      - name: metric_date
        tests:
          - not_null
      - name: current_price
      - name: high_24h
      - name: low_24h
      - name: intraday_range_pct
        description: Intraday price range as percentage of low price
      - name: daily_return_pct
        description: Day-over-day return percentage
      - name: volatility_7d
        description: 7-day rolling standard deviation of daily returns (%)
      - name: volatility_30d
        description: 30-day rolling standard deviation of daily returns (%)
      - name: volatility_bucket
        description: "Classification: low, medium, high, extreme, or insufficient_data"
        tests:
          - accepted_values:
              values: ["low", "medium", "high", "extreme", "insufficient_data"]

  - name: gold_liquidity_ranking
    description: >
      Daily liquidity ranking across all crypto assets by volume/market_cap ratio.
      Answers: "Which coins are most liquid?" and "Is BTC more liquid than ETH?"
    columns:
      - name: id
        tests:
          - not_null
      - name: symbol
        tests:
          - not_null
      - name: name
      - name: metric_date
        tests:
          - not_null
      - name: current_price
      - name: market_cap
      - name: total_volume
      - name: volume_to_market_cap_ratio
      - name: avg_liquidity_7d
        description: 7-day rolling average liquidity ratio
      - name: avg_liquidity_30d
        description: 30-day rolling average liquidity ratio
      - name: high_volume_anomaly_flag
        description: True if volume/mcap ratio exceeds 2 standard deviations above 30d mean
      - name: high_cap_low_liquidity_flag
        description: True if top-5 by market cap but outside top-5 by liquidity

  - name: gold_btc_dominance
    description: >
      Bitcoin dominance and relative performance vs the broader crypto market.
      Answers: "How does BTC dominance change during extreme fear?" and "Does ETH outperform BTC?"
    columns:
      - name: metric_date
        tests:
          - not_null
          - unique
      - name: btc_price
        tests:
          - not_null
      - name: eth_price
      - name: btc_market_cap
      - name: eth_market_cap
      - name: total_market_cap
        tests:
          - not_null
      - name: btc_dominance_pct
        description: BTC share of total market cap (%)
      - name: eth_dominance_pct
        description: ETH share of total market cap (%)
      - name: altcoin_dominance_pct
        description: Non-BTC share of total market cap (%)
      - name: btc_volume
      - name: eth_volume
      - name: total_market_volume
      - name: btc_volume_share_pct
        description: BTC share of total trading volume (%)
      - name: btc_daily_return_pct
      - name: eth_daily_return_pct
      - name: btc_eth_ratio
        description: BTC price divided by ETH price
      - name: fear_greed_value
      - name: fear_greed_label
      - name: btc_tx_count
      - name: btc_unique_addresses
      - name: btc_hash_rate
      - name: btc_mempool_size
      - name: num_coins
        description: Number of coins tracked on that day
      - name: unknown_market_cap_asset_count
        description: Number of assets with null market cap on the date
      - name: known_market_cap_asset_count
        description: Number of assets with non-null market cap on the date

  - name: gold_market_summary
    description: >
      Wide daily market snapshot per coin. The main "go-to" table for ad-hoc querying.
      Includes returns, volatility, sentiment, on-chain, and BTC-denominated price.
    columns:
      - name: id
        tests:
          - not_null
      - name: symbol
        tests:
          - not_null
      - name: name
      - name: metric_date
        tests:
          - not_null
      - name: current_price
      - name: market_cap
      - name: total_volume
      - name: high_24h
      - name: low_24h
      - name: market_cap_rank
      - name: circulating_supply
      - name: volume_to_market_cap_ratio
      - name: daily_return_pct
        description: Day-over-day price change (%)
      - name: return_7d_pct
        description: 7-day price change (%)
      - name: return_30d_pct
        description: 30-day price change (%)
      - name: intraday_range_pct
        description: Intraday high-low range as % of low
      - name: distance_from_ath_pct
        description: How far below all-time high (negative %)
      - name: distance_from_atl_pct
        description: How far above all-time low (%)
      - name: price_in_btc
        description: Price denominated in BTC
      - name: fear_greed_value
      - name: fear_greed_label
      - name: has_fear_greed_data
      - name: btc_tx_count
      - name: btc_unique_addresses
      - name: btc_hash_rate
      - name: btc_mempool_size
      - name: has_onchain_data
      - name: data_completeness_score_pct
        description: Completeness score (0-100) for sentiment/on-chain/core market fields
