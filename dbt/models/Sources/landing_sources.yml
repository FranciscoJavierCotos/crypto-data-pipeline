version: 2

sources:
  - name: bronze
    description: Bronze landing zone for raw CoinGecko market data ingested by Airflow.
    database: "{{ env_var('DATABRICKS_CATALOG', 'main') }}"
    schema: "{{ env_var('DATABRICKS_SCHEMA', 'bronze') }}"
    tables:
      - name: coingecko_market_data
        description: Raw CoinGecko payload and selected market fields captured per ingestion run.
        loaded_at_field: ingestion_ts
        config:
          freshness:
            warn_after:
              count: 36
              period: hour
            error_after:
              count: 72
              period: hour
        columns:
          - name: id
            tests:
              - not_null
          - name: symbol
            tests:
              - not_null
          - name: name
            tests:
              - not_null
          - name: current_price
            tests:
              - not_null
          - name: ingestion_ts
            tests:
              - not_null
          - name: source
            tests:
              - not_null
              - accepted_values:
                  values: ["coingecko_api"]
          - name: run_key
            description: Stable Airflow run identifier used for idempotent upserts.
            tests:
              - not_null

      - name: fear_greed_raw
        description: Daily fear and greed metric ingested from Alternative.me.
        loaded_at_field: ingestion_ts
        config:
          freshness:
            warn_after:
              count: 36
              period: hour
            error_after:
              count: 72
              period: hour
        columns:
          - name: value
            tests:
              - not_null
          - name: value_classification
            tests:
              - not_null
              - accepted_values:
                  values:
                    [
                      "Extreme Fear",
                      "Fear",
                      "Neutral",
                      "Greed",
                      "Extreme Greed",
                    ]
          - name: metric_date
            tests:
              - not_null
              - unique
          - name: ingestion_ts
            tests:
              - not_null
          - name: source
            tests:
              - not_null
              - accepted_values:
                  values: ["alternative_me_api"]
          - name: run_key
            description: Stable Airflow run identifier used for idempotent upserts.
            tests:
              - not_null

      - name: onchain_macro_raw
        description: Daily Bitcoin on-chain market context metrics from Blockchain.com charts API.
        loaded_at_field: ingestion_ts
        config:
          freshness:
            warn_after:
              count: 48
              period: hour
            error_after:
              count: 96
              period: hour
        columns:
          - name: metric_date
            tests:
              - not_null
              - unique
          - name: btc_tx_count
            tests:
              - not_null
          - name: btc_unique_addresses
            tests:
              - not_null
          - name: btc_hash_rate
            tests:
              - not_null
          - name: btc_mempool_size
            tests:
              - not_null
          - name: ingestion_ts
            tests:
              - not_null
          - name: source
            tests:
              - not_null
              - accepted_values:
                  values: ["blockchain_info_charts_api"]
          - name: run_key
            description: Stable Airflow run identifier used for idempotent upserts.
            tests:
              - not_null
